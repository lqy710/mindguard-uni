server:
  port: 8080

spring:
  application:
    name: mental-health
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mental_health}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: MentalHealthHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 10000ms
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mental.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:default-secret-key}
  expiration: ${JWT_EXPIRATION:604800000}

# 服务间内部调用令牌，Python ai-service 回调 /api/internal/** 时校验
# 生产环境必须通过环境变量 INTERNAL_API_TOKEN 覆盖，且与 ai-service 保持一致
internal:
  api-token: ${INTERNAL_API_TOKEN:mindguard-internal-token}

ai:
  python:
    url: ${AI_PYTHON_URL:http://localhost:5000}
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_MODEL:glm-4-flash}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.mental: debug
    org.springframework.security: info
